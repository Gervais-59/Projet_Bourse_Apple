# ------------------------------------------------------------------
# 1. L'IDENTITÉ DU ROBOT
# ------------------------------------------------------------------
# "name" : C'est le nom de ton robot. C'est le titre qui s'affichera sur GitHub.
name: Mon Premier Robot CI

# ------------------------------------------------------------------
# 2. LE DÉCLENCHEUR (Quand est-ce que le robot se réveille ?)
# ------------------------------------------------------------------
# "on" : Définit l'événement qui va réveiller le robot.
on:
  # "push" : Le robot s'active uniquement quand on envoie un nouveau carton de code.
  push:
    # "branches" : On lui précise sur quelle branche il doit surveiller les envois.
    branches:
      # "- main" : Il ne s'activera que si tu pousses sur la branche principale (main).
      - main

# ------------------------------------------------------------------
# 3. LE TRAVAIL À FAIRE (La liste des tâches)
# ------------------------------------------------------------------
# "jobs" : C'est ici qu'on liste tout ce que le robot doit accomplir.
jobs:
  # "test_syntaxe" : C'est le nom qu'on donne à notre tâche principale.
  test_syntaxe:
    
    # "runs-on" : On dit à GitHub de nous prêter un ordinateur avec ce système d'exploitation.
    # Ici, on demande la dernière version de Linux Ubuntu.
    runs-on: ubuntu-latest
    
    # "steps" : C'est la recette pas-à-pas que le robot va exécuter sur l'ordinateur Ubuntu.
    steps:
      
      # --- ÉTAPE 1 : Télécharger le code ---
      # "name" : Un petit titre pour qu'on puisse suivre l'étape sur l'écran de GitHub.
      - name: 1. Récupérer le code
        # "uses" : On utilise un outil officiel de GitHub (checkout@v4) qui copie tes fichiers 
        # depuis ton dépôt GitHub vers le petit ordinateur Ubuntu qui vient d'être allumé.
        uses: actions/checkout@v4

      # --- ÉTAPE 2 : Préparer Python ---
      - name: 2. Installer Python
        # On utilise un autre outil officiel pour installer Python sur l'ordinateur Ubuntu.
        uses: actions/setup-python@v5
        # "with" : Permet de donner des options à l'outil d'installation.
        with:
          # On exige d'installer spécifiquement la version 3.10 de Python.
          python-version: '3.10'

      # --- ÉTAPE 3 : Le crash-test de ton code ! ---
      - name: 3. Vérification de la syntaxe
        # "run" : On demande au robot de taper cette commande exacte dans le terminal de l'ordinateur Ubuntu.
        # "py_compile" va lire "Training_poo.py". S'il manque une parenthèse ou un deux-points, 
        # la commande va planter, le robot va s'arrêter, et mettre une croix rouge !
        run: python -m py_compile Training_poo.py